server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router maneja las rutas del lado del cliente: cualquier ruta que
    # no sea un archivo real cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El frontend llama a /api/*; aqui se reenvia al gateway dentro de la
    # misma red de docker compose. Al quedar bajo el mismo origen (mismo
    # host:puerto que sirve la pagina), no hay problemas de CORS.
    location /api/ {
        proxy_pass http://gateway:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
