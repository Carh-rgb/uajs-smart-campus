server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx en las cabeceras ni en las páginas de error.
    server_tokens off;

    # Cabeceras básicas de seguridad para la interfaz.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión de los estáticos y del JSON de la API.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos de /assets llevan hash en el nombre (build de Vite):
    # se pueden guardar en caché mucho tiempo sin riesgo de servir uno viejo.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router maneja las rutas del lado del cliente: cualquier ruta que
    # no sea un archivo real cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El frontend llama a /api/*; aquí se reenvía al gateway dentro de la
    # misma red de docker compose. Al quedar bajo el mismo origen (mismo
    # host:puerto que sirve la página), el navegador no necesita CORS.
    location /api/ {
        proxy_pass http://gateway:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # El aviso de conexión del frontend consulta /health (salud de los 7
    # servicios vista por el gateway). Sin esta ruta caería en index.html.
    location = /health {
        proxy_pass http://gateway:4000/health;
        proxy_set_header Host $host;
    }
}
