services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: uajs-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - uajs_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: uajs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uajs
      POSTGRES_PASSWORD: uajs_dev_pass
      POSTGRES_DB: uajs_usuarios
    ports:
      - "5432:5432"
    volumes:
      - uajs_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uajs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uajs_pgdata:
    name: uajs_pgdata
  uajs_esdata:
    name: uajs_esdata
